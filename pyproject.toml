[project]
name = "flats-retrieval"
version = "0.1.0"
description = "Poll OLX and Otodom rent listings and forward new flats to Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "camoufox>=0.4.11",
  "httpx>=0.28.1",
]

[project.scripts]
flats-retrieval = "flats_retrieval.__main__:main"

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
